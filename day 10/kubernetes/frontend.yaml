apiVersion: apps/v1
kind: Deployment
metadata:
  name: wayshub-frontend-deployment
  namespace: wayshub
  labels:
    app: wayshub-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wayshub-frontend
  template:
    metadata:
      labels:
        app: wayshub-frontend
    spec:
      containers:
      - name: wayshub-frontend
        image: millinovz/wayshub-frontend:v1
        ports:
        - containerPort: 3000

---

apiVersion: v1
kind: Service
metadata:
  name: wayshub-frontend-service
  namespace: wayshub
spec:
  selector:
    app: wayshub-frontend
  type: NodePort
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wayshub-frontend-ingress
  namespace: wayshub
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app.kubernetes/name: wayshub-frontend-ingress
spec:
  ingressClassName: "nginx"
  rules:
  - host: millinov.studentdumbways.my.id
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wayshub-frontend-service
            port:
              number: 3000