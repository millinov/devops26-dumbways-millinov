apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: wayshub
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: lolramdon123
  MYSQL_DATABASE: wayshub
  MYSQL_USER: miral
  MYSQL_PASSWORD: lolramdon123

---

apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: wayshub
spec:
  ports:
  - port: 3306
  selector:
    app: mysql
  clusterIP: None

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: wayshub
spec:
  selector:
    matchLabels:
      app: mysql
  serviceName: "mysql-service"
  replicas: 1
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - image: mysql:latest
        name: mysql
        envFrom:
        - secretRef:
            name: mysql-secret
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: mysql-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 2Gi
