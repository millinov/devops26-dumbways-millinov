apiVersion: apps/v1
kind: Deployment
metadata:
  name: dumbmerch-frontend-deployment
  namespace: dumbmerch
  labels:
    app: dumbmerch-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dumbmerch-frontend
  template:
    metadata:
      labels:
        app: dumbmerch-frontend
    spec:
      containers:
      - name: dumbmerch-frontend
        image: registry.millinov.studentdumbways.my.id/frontend-dumbmerch:prod
        ports:
        - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: dumbmerch-frontend-service
  namespace: dumbmerch
spec:
  selector:
    app: dumbmerch-frontend
  type: NodePort
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 80

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dumbmerch-frontend-ingress
  namespace: dumbmerch
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app.kubernetes/name: dumbmerch-frontend-ingress
spec:
  ingressClassName: "nginx"
  tls:
  - hosts:
    - millinov.studentdumbways.my.id
    secretName: dumbmerch-wildcard-secret
  rules:
  - host: millinov.studentdumbways.my.id  # Replace with your actual domain or IP
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dumbmerch-frontend-service
            port:
              number: 3000