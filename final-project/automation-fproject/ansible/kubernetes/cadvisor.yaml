apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cadvisor
  namespace: monitoring
  labels:
    app: cadvisor

spec:
  selector:
    matchLabels:
      app: cadvisor

  template:
    metadata:
      labels:
        app: cadvisor

    spec:
      containers:
        - name: cadvisor
          image: gcr.io/cadvisor/cadvisor:v0.52.1

          ports:
            - name: metrics
              containerPort: 8080
              hostPort: 8080
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 500Mi

          securityContext:
            privileged: true

          volumeMounts:
            - name: rootfs
              mountPath: /rootfs
              readOnly: true

            - name: var-run
              mountPath: /var/run/cadvisor-host
              readOnly: true

            - name: sys
              mountPath: /sys
              readOnly: true

            - name: containerd
              mountPath: /run/containerd
              readOnly: true

      volumes:
        - name: rootfs
          hostPath:
            path: /

        - name: var-run
          hostPath:
            path: /var/run

        - name: sys
          hostPath:
            path: /sys

        - name: containerd
          hostPath:
            path: /run/containerd

---

apiVersion: v1
kind: Service
metadata:
  name: cadvisor-service
  namespace: monitoring

spec:
  selector:
    app: cadvisor

  ports:
    - name: metrics
      port: 8080
      targetPort: 8080