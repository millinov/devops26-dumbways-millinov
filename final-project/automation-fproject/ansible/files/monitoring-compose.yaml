services:
  
  nodexp:
    container_name: node-exporter
    image: prom/node-exporter
    
    ports:
      - 9100:9100

    volumes:
     - "/proc:/host/proc:ro"
     - "/sys:/host/sys:ro"
     - "/:/rootfs:ro"
     
    command:
      - "--web.listen-address=:9100"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.ignored-mount-points='^/(sys|proc|dev|host|etc|rootfs|var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)'"

  prometheus:
    container_name: prometheus
    image: prom/prometheus
    restart: unless-stopped
    ports:
      - 9090:9090
    stdin_open: true
    volumes:
      - "/home/finaltask-miral/docker/prometheus.yaml:/etc/prometheus/prometheus.yml"
      - "/home/finaltask-miral/docker/web-prometheus.yaml:/etc/prometheus/web.yml"
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - '--web.config.file=/etc/prometheus/web.yml'
      - '--storage.tsdb.retention.time=3d'
      - '--storage.tsdb.max-block-duration=2h'

  grafana:
    container_name: grafana
    image: grafana/grafana
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SERVER_ROOT_URL=https://monitoring.millinov.studentdumbways.my.id/
      
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped

    ports:
      - "8080:8080"
      
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro   


volumes:

  prometheus-data:
  grafana-data:


