  - targets:
      - "10.184.0.9:8080"
    labels:
      server: "app-server-2"

  - targets:
      - "10.184.0.2:8080"
    labels:
      server: "build-server"

  - targets:
      - "10.184.0.7:8080"
    labels:
      server: "jenkins-server"

  - targets:
      - "10.184.0.5:8080"
    labels:
      server: "sonarqube-server"

  - targets:
      - "10.184.0.8:8080"
    labels:
