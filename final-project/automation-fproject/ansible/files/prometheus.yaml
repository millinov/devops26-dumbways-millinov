global:
  evaluation_interval: 10s

scrape_configs:
- job_name: appserver-1
  scrape_interval: 10s
  scheme: https
  static_configs:
  - targets:
    - app1.exporter.millinov.studentdumbways.my.id
    labels:
      server: "app-server-1"

- job_name: appserver-2
